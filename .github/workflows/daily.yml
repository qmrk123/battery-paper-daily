name: daily

# 06:00 KST (21:00 UTC) daily: fetch new papers -> Korean summaries (Gemini) ->
# graphical-abstract thumbnails -> commit data back -> build -> deploy Pages.
# A `push` to data/site (e.g. manual edit) just rebuilds + redeploys.
# NOTE: scheduled workflows are disabled after 60 days of repo inactivity and
# only run from the default branch.
on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      force_summarize:
        description: "Re-summarize every paper (overwrite existing summaries)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "data/**"
      - "site/**"
      - "scripts/build_site.py"
      - ".github/workflows/daily.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Content steps run on the schedule / manual trigger, not on plain pushes
      # (a push already carries fresh content — just rebuild + deploy).
      - name: Install dependencies
        if: github.event_name != 'push'
        run: pip install -r requirements.txt

      - name: Fetch new papers (OpenAlex + arXiv)
        if: github.event_name != 'push'
        env:
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: python -m pipeline.main

      - name: Korean summaries + relevance gate
        if: github.event_name != 'push'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ] || [ -n "$ANTHROPIC_API_KEY" ]; then
            python -m pipeline.summarize ${{ inputs.force_summarize && '--force' || '' }}
          else
            echo "no summarizer key (set GEMINI_API_KEY) — skipping Korean summaries"
          fi

      - name: Graphical-abstract thumbnails (best-effort, CC-OA only)
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: python -m pipeline.images

      - name: Commit data back (persists the seen-ledger + daily files)
        if: github.event_name != 'push'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ site/img/
          if git diff --staged --quiet; then
            echo "no data changes"
          else
            git commit -m "data: daily update ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Assemble public/
        run: python scripts/build_site.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
