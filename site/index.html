<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>전지 소재 논문 데일리</title>
  <meta name="description" content="리튬·소듐 금속 음극과 High-Ni·Li-rich 양극재 신규 논문을 매일 정리합니다." />
  <link rel="preconnect" href="https://api.openalex.org" />
  <link rel="alternate" type="application/rss+xml"
        title="전지 소재 논문 데일리" href="feed.xml" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <a class="skip" href="#feed">본문으로 건너뛰기</a>

  <header class="masthead">
    <div class="masthead__row">
      <div class="wordmark">
        <span class="wordmark__pulse" aria-hidden="true"></span>
        <span class="wordmark__text">
          <b>전지 소재 논문</b><span class="wordmark__daily">DAILY</span>
        </span>
      </div>

      <div class="masthead__controls">
        <label class="datepick">
          <span class="datepick__label">날짜</span>
          <select id="date-select" aria-label="날짜 선택"></select>
        </label>
        <span class="datestep" role="group" aria-label="날짜 한 칸씩 이동">
          <button id="date-newer" class="icon-btn icon-btn--step" type="button"
                  aria-label="다음(최신) 날짜" title="다음(최신) 날짜">▲</button>
          <button id="date-older" class="icon-btn icon-btn--step" type="button"
                  aria-label="이전(과거) 날짜" title="이전(과거) 날짜">▼</button>
        </span>
        <button id="theme-toggle" class="icon-btn" type="button"
                aria-label="테마 전환" title="라이트/다크 전환">◐</button>
      </div>
    </div>

    <p class="masthead__tag">
      리튬 금속 · 소듐 금속 음극 / High-Ni NCM · Li-rich 양극재 —
      매일 새로 색인된 논문을 소재별로 모읍니다.
    </p>

    <div class="toolbar" role="search">
      <div class="search">
        <span class="search__icon" aria-hidden="true">🔍</span>
        <input id="search" type="search" autocomplete="off" spellcheck="false"
               placeholder="전체 검색 — 제목·초록·저자·저널·DOI…" aria-label="논문 전체 검색" />
        <button id="search-clear" class="search__clear" type="button"
                aria-label="검색 지우기" hidden>×</button>
      </div>
      <button id="f-sem" class="chip" type="button" aria-pressed="false"
              title="자유문장 의미검색(뉴럴). 최초 1회 ~25MB 모델 다운로드, 이후 캐시">🧠 의미</button>
      <select id="range" class="filter-select" aria-label="기간 필터">
        <option value="0">전체 기간</option>
        <option value="7">최근 7일</option>
        <option value="14">최근 14일</option>
        <option value="30">최근 30일</option>
        <option value="90">최근 90일</option>
      </select>
      <select id="facet" class="filter-select" aria-label="정밀 태그 필터">
        <option value="">🔬 정밀 태그</option>
        <optgroup label="기법">
          <option value="insitu-tem">in-situ TEM</option>
          <option value="cryo">cryo-EM</option>
          <option value="stem-haadf">STEM/HAADF</option>
          <option value="eels">EELS</option>
          <option value="xrd">XRD</option>
          <option value="xas">XAS/XPS</option>
          <option value="nmr">NMR</option>
          <option value="dft">DFT/계산</option>
          <option value="ml">머신러닝</option>
        </optgroup>
        <optgroup label="문제·현상">
          <option value="cation-mixing">양이온 혼합/암염</option>
          <option value="cracking">균열/기계</option>
          <option value="oxygen-redox">산소 산화환원</option>
          <option value="dendrite">덴드라이트</option>
          <option value="sei-cei">SEI/CEI</option>
          <option value="thermal-gas">열/가스</option>
          <option value="fast-charge">급속충전</option>
          <option value="coating-doping">코팅/도핑</option>
          <option value="single-crystal">단결정</option>
        </optgroup>
      </select>
      <button id="f-nsc" class="chip" type="button" aria-pressed="false"
              title="최상위 저널만 — Nature 계열·Science 계열·Cell·Nature Energy·Joule·EES (Nature Comm.·Science Adv. 제외)">🏆 최상위</button>
      <button id="f-oa" class="chip" type="button" aria-pressed="false"
              title="오픈액세스만">OA</button>
      <button id="f-img" class="chip" type="button" aria-pressed="false"
              title="그래픽 초록 있는 것만">🖼 이미지</button>
      <button id="f-watch" class="chip" type="button" aria-pressed="false"
              title="워치한 저자·그룹의 논문만">⭐ 워치</button>
      <button id="f-bmk" class="chip" type="button" aria-pressed="false"
              title="북마크한 논문만">🔖 북마크</button>
      <button id="f-reco" class="chip" type="button" aria-pressed="false"
              title="북마크한 논문들과 비슷한 추천 논문">✨ 추천</button>
      <span class="toolbar__spacer" aria-hidden="true"></span>
      <button id="export-bib" class="chip chip--action" type="button"
              title="현재 보이는 목록을 BibTeX(.bib)로 저장">⬇ BibTeX</button>
      <button id="export-ris" class="chip chip--action" type="button"
              title="현재 보이는 목록을 RIS(.ris)로 저장">⬇ RIS</button>
      <button id="share-link" class="chip chip--action" type="button"
              title="현재 검색·필터 상태를 공유 링크로 복사">🔗 링크</button>
    </div>

    <nav id="tabs" class="tabs" aria-label="소재 분류"></nav>
  </header>

  <main id="feed" class="feed" tabindex="-1">
    <section id="digest" class="digest" hidden></section>
    <div id="status" class="status" role="status">데이터를 불러오는 중…</div>
    <div id="cards" class="cards"></div>
  </main>

  <footer class="colophon">
    <span id="colophon-meta" class="mono"></span>
    <span class="colophon__src">
      출처 <a href="https://openalex.org" target="_blank" rel="noopener">OpenAlex</a>
      · <a href="https://arxiv.org" target="_blank" rel="noopener">arXiv</a>
      · <a href="feed.xml" title="피드리더로 구독">RSS 구독</a>
      · 한글 요약은 자동 생성이며 원문 확인을 권장합니다.
    </span>
  </footer>

  <script src="app.js" defer></script>
</body>
</html>
