# Topic definitions for the daily battery-paper tracker.
#
# Pipeline precision is a 3-stage funnel:
#   1. `queries`   -> OpenAlex title_and_abstract.search (broad recall)
#   2. `include` / `exclude` regex -> cheap post-filter (precision, no API)
#   3. LLM relevance gate in the summary step (Phase 4, final precision)
#
# Regexes run case-insensitively against (title + " " + abstract).
# A paper is kept by stage 2 if it matches >=1 `include` pattern AND
# matches 0 `exclude` patterns. Tune these against real output with
#   python -m pipeline.main --topic <id> --dry-run --show-filtered

defaults:
  # rolling publication-date window (days) queried each run; dedup handles overlap
  window_days: 7
  # max OpenAlex results pulled per topic per run (pagination cap)
  max_per_topic: 200
  # OpenAlex work types to keep
  types: [article, review, preprint, book-chapter]
  # Journal gate. If `allow_journals` is non-empty it is used (keep ONLY those
  # journals + any "Nature ..." sister journal); otherwise fall back to the
  # metric threshold below. Edit the list to curate.
  allow_journals:
    - Nature                    # + all "Nature ..." sisters (Communications, Energy, Materials, ...)
    - Science
    - Joule
    - Energy & Environmental Science
    - Advanced Materials
    - Advanced Energy Materials
    - Advanced Functional Materials
    - Advanced Science
    - Materials Today
    - ACS Energy Letters
    - ACS Nano
    - Energy Storage Materials
    - Nano Energy
    - Journal of Energy Chemistry
    - Journal of the American Chemical Society
    - Angewandte Chemie International Edition
    - Angewandte Chemie
  # Fallback when allow_journals is empty: keep journals with OpenAlex
  # 2yr_mean_citedness (impact-factor-like) >= this. Small ≈ 8.7.
  min_journal_metric: 6.0
  # Keep arXiv preprints? They have no journal metric. false = journals only.
  include_preprints: false
  # Every kept paper must ALSO match one of these — an electrochemical-context
  # gate that kills physics/chemistry hits sharing a keyword (e.g. "lithium-rich"
  # antiperovskite magnets). Topics may override with their own `context`.
  context:
    - 'cathode|anode|electrode|batter|electrochem|\bredox\b|cycl(?:e|ing|abilit)|capacity|electrolyte|delithiat|lithiat|sodiat|coulombic|dendrit|plating|stripping|half[- ]cell|full[- ]cell|li[- ]ion|na[- ]ion|energy storage|solid[- ]state electrolyte'
  # Journal-FIRST pass keeps only papers matching THIS battery-specific gate — much
  # tighter than `context` (which is generic electrochem) so we don't flood with the
  # general-materials output of AM/AFM/Adv Sci. The LLM still does final 6-topic scoping.
  journal_gate:
    - 'batter|\b(?:li|na|k|zn)[- ]?ion\b|\blithium\b|\bsodium\b|li[- ]?metal|na[- ]?metal|anode[- ]?free|\bSEI\b|dendrit|LiFePO|olivine|\bNCM\b|\bNMC\b|\bNCA\b|\bLCO\b|\bLNMO\b|\bLMO\b|layered (?:cathode|oxide)|li[- ]?rich|li[- ]?excess|disordered rock|\bDRX\b|polysulfide|lithium[- ]?sulfur|prussian blue|intercalat|(?:de)?lithiat|(?:de)?sodiat|plating.{0,20}stripping|solid[- ]?state electrolyte'
  # Journal-FIRST applies ONLY to these (selective high-impact journals the topic
  # queries under-collect). High-volume Advanced/ACS/Angew/JACS stay query-driven —
  # already well covered — so the digest stays curated, not a firehose.
  journal_first_sources:
    - Energy & Environmental Science
    - Joule
    - Science
    - Energy Storage Materials
    - Nano Energy
    - Journal of Energy Chemistry
    - Materials Today
    - Nature
    - Nature Communications
    - Nature Energy
    - Nature Materials
    - Nature Nanotechnology
    - Nature Chemistry
    - Nature Reviews Materials

topics:
  - id: li-metal
    label_ko: "리튬 금속 음극"
    label_en: "Lithium metal anode"
    emoji: "🔋"
    queries:
      - "lithium metal anode"
      - "lithium metal battery"
      - "anode-free lithium"
      - "lithium dendrite"
      - "lithium plating stripping"
    arxiv: 'abs:"lithium metal anode" OR abs:"anode-free" OR abs:"lithium dendrite"'
    include:
      - 'lithium metal|li[ -]?metal\b|anode[- ]free|lithium dendrite|li dendrite|plating.{0,15}stripping'
    exclude:
      - '\bsodium\b|\bpotassium\b|\bzinc\b|\bmagnesium\b.{0,20}anode'
      - 'welding|superalloy|corrosion of (?:al|steel)|electrocatalys|water splitting|fuel cell'

  - id: na-metal
    label_ko: "소듐 금속 음극"
    label_en: "Sodium metal anode"
    emoji: "🟡"
    queries:
      - "sodium metal anode"
      - "sodium metal battery"
      - "anode-free sodium"
      - "sodium dendrite"
    arxiv: 'abs:"sodium metal anode" OR abs:"anode-free sodium" OR abs:"sodium dendrite"'
    include:
      - 'sodium metal|na[ -]?metal\b|anode[- ]free sodium|sodium dendrite|na dendrite'
    exclude:
      - 'welding|superalloy|electrocatalys|water splitting|fuel cell'

  - id: ncm
    label_ko: "NCM 양극"
    label_en: "NCM/NMC cathode"
    emoji: "🟢"
    queries:
      - "NCM cathode"
      - "NMC cathode"
      - "nickel cobalt manganese oxide cathode"
      - "nickel-rich layered cathode"
      - "LiNiCoMnO2"
      - "layered oxide cathode lithium"
    arxiv: 'abs:"NMC cathode" OR abs:"nickel-rich cathode" OR abs:"NCM"'
    include:
      - '\bncm\b|\bnmc\b|ni[- ]?rich|nickel[- ]?rich|nickel[- ]cobalt[- ]manganese|lini.{0,6}(co|mn)|lini0\.[3-9]|layered.{0,15}(ni|nickel|oxide) cathode'
    exclude:
      - 'nickel (?:production|recovery|extraction|plating|foam|superalloy)|electrocatalys|water splitting|welding'
      - '\bsodium[- ]ion\b|\bna[- ]?ion\b|\bp2-type\b'

  - id: lfp
    label_ko: "LFP 양극"
    label_en: "LiFePO4 / olivine cathode"
    emoji: "🟣"
    queries:
      - "lithium iron phosphate cathode"
      - "LiFePO4 battery"
      - "olivine cathode"
      - "LFP cathode"
    arxiv: 'abs:"LiFePO4" OR abs:"lithium iron phosphate"'
    include:
      - 'lifepo4|lifepo|lithium iron phosphate|olivine|\blfp\b|lmfp|limnfepo'
    exclude:
      - 'electrocatalys|water splitting|\bna[- ]?ion\b'

  - id: li-rich
    label_ko: "리튬 과잉(Li-rich) 양극"
    label_en: "Li-rich / Li-excess cathode"
    emoji: "🔵"
    queries:
      - "lithium-rich cathode"
      - "lithium-rich layered oxide"
      - "Li-excess cathode"
      - "oxygen redox cathode"
      - "anionic redox lithium"
    arxiv: 'abs:"lithium-rich" OR abs:"Li-rich layered" OR abs:"anionic redox"'
    include:
      - 'li[- ]?rich|lithium[- ]?rich|li[- ]?excess|lithium[- ]?excess|over[- ]?lithiat|li1\.2|anionic redox|oxygen redox'
    exclude:
      - '\bsodium\b|\bna[- ]?rich\b|electrocatalys|water splitting|fuel cell'

  - id: other-cathode
    label_ko: "기타 양극재"
    label_en: "Other Li cathode (LCO, spinel, PB, organic, S, O2, ...)"
    emoji: "⚪"
    # Broad recall for all remaining Li cathodes; the LLM does the final bucketing
    # (NCM/Li-rich/LFP are handled by their own tabs and excluded here by the LLM).
    queries:
      - "LiCoO2 cathode"
      - "spinel cathode lithium"
      - "high-voltage spinel LiNi0.5Mn1.5O4"
      - "lithium manganese oxide cathode"
      - "Prussian blue cathode lithium"
      - "organic cathode lithium battery"
      - "lithium sulfur battery cathode"
      - "lithium oxygen battery cathode"
      - "disordered rock salt cathode"
      - "conversion cathode lithium"
      - "polyanion cathode lithium"
    arxiv: 'abs:"LiCoO2" OR abs:"lithium sulfur" OR abs:"spinel cathode"'
    include:
      - 'licoo2|\blco\b|spinel|limn2o4|\blmo\b|lini0\.5mn1\.5|lnmo|prussian blue|organic cathode|lithium[- ]sulfur|li[- ]?s battery|sulfur cathode|lithium[- ]oxygen|li[- ]?o2|disordered rock|conversion cathode|polyanion|fluoride cathode|vanadium oxide cathode'
    exclude:
      - '\bsodium[- ]ion\b|\bna[- ]?ion\b|na3v2|electrocatalys|water splitting|fuel cell|oxygen evolution|hydrogen evolution'
